<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #f6f2e9;
      --bg-2: #f0f7f2;
      --ink: #1d1a16;
      --muted: #6e655b;
      --accent: #0f766e;
      --accent-2: #a16207;
      --card: #ffffff;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 10% 0%, var(--bg-1), transparent 60%),
                  radial-gradient(900px 500px at 90% 10%, var(--bg-2), transparent 60%),
                  #f9f8f4;
      min-height: 100vh;
    }

    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      animation: fadeIn 420ms ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: clamp(1.6rem, 2vw + 1rem, 2.6rem);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .control-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-input {
      border-radius: 12px;
      border: 1px solid #e2ddd2;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }

    .counter {
      background: var(--card);
      border: 1px solid #e8e1d5;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-weight: 500;
    }

    .table-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #efe7da;
      overflow: hidden;
    }

    table {
      margin-bottom: 0;
    }

    thead th {
      background: #f3efe6;
      color: #3a3127;
      position: sticky;
      top: 0;
      z-index: 1;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    tbody tr {
      transition: background 140ms ease-in-out;
    }

    tbody tr:hover {
      background: #f7f2e7;
    }

    .badge-lite {
      background: rgba(15, 118, 110, 0.12);
      color: var(--accent);
      border: 1px solid rgba(15, 118, 110, 0.2);
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      display: inline-block;
      margin-left: 6px;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .control-bar {
        grid-template-columns: 1fr;
      }

      thead {
        display: none;
      }

      tbody tr {
        display: block;
        border-bottom: 1px solid #efe7da;
        padding: 12px 14px;
      }

      tbody td {
        display: block;
        padding: 6px 0;
      }

      tbody td::before {
        content: attr(data-label);
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="page-wrap">
    <header class="mb-3">
      <h1 class="title">Danh sách Legendary và biome spawn</h1>
      <p class="subtitle">Pixelmon 9.3.13 | Lọc nhanh theo tên, biome, thời gian, thời tiết.</p>
    </header>

    <section class="control-bar">
      <input id="search" class="form-control search-input" type="search" placeholder="Tìm Pokemon, biome, điều kiện..." />
      <div id="counter" class="counter">Đang tải dữ liệu...</div>
    </section>

    <section class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Pokemon</th>
              <th>Biome</th>
              <th>Thời gian</th>
              <th>Thời tiết</th>
              <th>Vị trí</th>
              <th>Ghi chú</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          row.push(cur);
          cur = "";
        } else if (ch === '\n' && !inQuotes) {
          row.push(cur);
          rows.push(row);
          row = [];
          cur = "";
        } else if (ch === '\r') {
          continue;
        } else {
          cur += ch;
        }
      }
      if (cur.length || row.length) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function buildTable(data) {
      const headers = data[0];
      const rows = data.slice(1);
      const index = {
        Pokemon: headers.indexOf("Pokemon"),
        Biomes_VI: headers.indexOf("Biomes_VI"),
        Times_VI: headers.indexOf("Times_VI"),
        Weather_VI: headers.indexOf("Weather_VI"),
        LocationTypes_VI: headers.indexOf("LocationTypes_VI"),
        Notes_VI: headers.indexOf("Notes_VI")
      };

      return rows.map((r) => ({
        pokemon: r[index.Pokemon] || "",
        biomes: r[index.Biomes_VI] || "",
        times: r[index.Times_VI] || "",
        weather: r[index.Weather_VI] || "",
        location: r[index.LocationTypes_VI] || "",
        notes: r[index.Notes_VI] || ""
      }));
    }

    const data = buildTable(parseCSV(csvText));
    const tbody = document.getElementById("rows");
    const counter = document.getElementById("counter");
    const search = document.getElementById("search");

    function renderRows(list) {
      tbody.innerHTML = list.map((row) => `
        <tr>
          <td data-label="Pokemon"><strong>${row.pokemon}</strong></td>
          <td data-label="Biome">${row.biomes || '<span class="muted">Không có</span>'}</td>
          <td data-label="Thời gian">${row.times || '<span class="muted">Không có</span>'}</td>
          <td data-label="Thời tiết">${row.weather || '<span class="muted">Không có</span>'}</td>
          <td data-label="Vị trí">${row.location || '<span class="muted">Không có</span>'}</td>
          <td data-label="Ghi chú">${row.notes || '<span class="muted">-</span>'}</td>
        </tr>
      `).join("");
    }

    function updateCounter(list) {
      counter.innerHTML = `${list.length} dòng <span class="badge-lite">Legendary</span>`;
    }

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      if (!q) {
        renderRows(data);
        updateCounter(data);
        return;
      }
      const filtered = data.filter((r) => {
        const blob = [r.pokemon, r.biomes, r.times, r.weather, r.location, r.notes].join(" ").toLowerCase();
        return blob.includes(q);
      });
      renderRows(filtered);
      updateCounter(filtered);
    }

    renderRows(data);
    updateCounter(data);
    search.addEventListener("input", applyFilter);
  </script>
